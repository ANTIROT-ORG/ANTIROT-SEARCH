name: Antirot - Common Crawl Ingest

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      domains:
        description: 'Comma-separated domains'
        required: false
        default: 'plato.stanford.edu,developer.mozilla.org,docs.python.org'
      per_domain:
        description: 'Pages per domain'
        required: false
        default: '20'

env:
  PYTHON_VERSION: '3.11'
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Restore golden layer + crawl state
        uses: actions/cache@v4
        with:
          path: |
            search/data/local.db
            search/data/crawl_state.json
            search/data/crawl_schedule.json
            search/data/crawl_stats.json
            search/data/content_changes.json
            search/data/content_removals.json
          key: antirot-state-${{ github.run_id }}
          restore-keys: |
            antirot-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r search/requirements.txt

      - name: Common Crawl ingest
        run: |
          DOMAINS="${{ github.event.inputs.domains || 'plato.stanford.edu,developer.mozilla.org,docs.python.org' }}"
          PER_DOMAIN="${{ github.event.inputs.per_domain || '20' }}"
          ARGS=""
          IFS=',' read -ra LIST <<< "$DOMAINS"
          for d in "${LIST[@]}"; do ARGS="$ARGS --domain $d"; done
          python -m search.cc_ingest $ARGS --per-domain "$PER_DOMAIN" --concurrency 6

      - name: Filter + index (no live crawl)
        env:
          CRAWL_SKIP_CRAWL: 'true'
        run: python -m search.pipeline
