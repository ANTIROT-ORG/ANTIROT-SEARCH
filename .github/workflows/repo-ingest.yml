name: Antirot - Repo Ingest

on:
  schedule:
    - cron: '0 5 * * 2'   # weekly, Tuesday 05:00 UTC
  workflow_dispatch:
    inputs:
      topics:
        description: 'Comma-separated GitHub topics'
        required: false
        default: 'search-engine,information-retrieval,library,documentation,developer-tools'

env:
  PYTHON_VERSION: '3.11'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Restore golden layer + crawl state
        uses: actions/cache@v4
        with:
          path: |
            search/data/local.db
            search/data/crawl_state.json
            search/data/crawl_schedule.json
            search/data/crawl_stats.json
            search/data/content_changes.json
            search/data/content_removals.json
          key: antirot-state-${{ github.run_id }}
          restore-keys: |
            antirot-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r search/requirements.txt

      - name: GitHub repository ingest
        run: |
          TOPICS="${{ github.event.inputs.topics || 'search-engine,information-retrieval,library,documentation,developer-tools' }}"
          python -m search.github_ingest --topics "$TOPICS"

      - name: Filter + index (no live crawl)
        env:
          CRAWL_SKIP_CRAWL: 'true'
        run: python -m search.pipeline