name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
          pip install -r search/requirements.txt
      - name: Unit tests (slop gate, indexer, dedup, eval, ingest)
        run: python -m pytest tests/test_capybara.py -v

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check — exits 1 on errors)
        run: npm run check
      - name: Unit tests (query operators, spelling, PAA, answer)
        run: npm test
