[package]
name = "ratsearch-index"
version = "0.1.0"
edition = "2021"
description = "Tantivy serving index for RatSearch (classical BM25, no ML)"

[[bin]]
name = "ratsearch-index"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.24"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
